<title>Le Salon — messagerie</title>

<!--
=====================================================================
  LE SALON — messagerie temps réel (1 seul fichier)
  Stack : HTML + JS pur + Firebase (Auth anonyme + Firestore)
=====================================================================

  POURQUOI FIREBASE ET PAS UN SERVEUR NODE ?
  - Aucun serveur à héberger ni à maintenir : le navigateur parle
    directement à la base de données de Google.
  - Le temps réel est intégré (onSnapshot) : pas de WebSocket à coder.
  - Le fichier reste 100 % statique, donc hébergeable sur GitHub Pages.
  - Gratuit jusqu'à ~50 000 lectures/jour, très au-dessus de tes besoins.

---------------------------------------------------------------------
  INSTALLATION — 5 ÉTAPES (10 minutes)
---------------------------------------------------------------------

  1) Va sur https://console.firebase.google.com → "Créer un projet".
     Nom au choix, tu peux désactiver Google Analytics.

  2) Dans le projet : "Build" → "Authentication" → "Get started"
     → onglet "Sign-in method" → active "Anonyme" (Anonymous).
     C'est ce qui donne un identifiant unique à chaque visiteur
     sans lui demander de mot de passe.

  3) "Build" → "Firestore Database" → "Create database"
     → choisis "Start in production mode" → région "eur3 (europe-west)".

  4) Onglet "Rules" de Firestore, colle EXACTEMENT ceci puis "Publish" :

        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /salons/{salon}/messages/{message} {
              // Lecture : réservée aux visiteurs authentifiés
              allow read: if request.auth != null;
              // Création : le champ uid doit correspondre à l'auteur réel,
              // le pseudo fait 1 à 20 caractères, le texte 1 à 500.
              allow create: if request.auth != null
                && request.resource.data.uid == request.auth.uid
                && request.resource.data.texte is string
                && request.resource.data.texte.size() > 0
                && request.resource.data.texte.size() <= 500
                && request.resource.data.pseudo is string
                && request.resource.data.pseudo.size() > 0
                && request.resource.data.pseudo.size() <= 20;
              // Suppression : uniquement ses propres messages
              allow delete: if request.auth != null
                && resource.data.uid == request.auth.uid;
              // Modification : interdite pour tout le monde
              allow update: if false;
            }
          }
        }

  5) Réglages du projet (roue crantée) → "Vos applications" → icône </>
     → enregistre une application Web → copie l'objet firebaseConfig
     et colle-le plus bas dans ce fichier (cherche "COLLE TA CONFIG ICI").

  Ensuite : ouvre le fichier dans le navigateur, ou pousse-le sur
  GitHub Pages. Deux onglets = deux utilisateurs, pour tester.

---------------------------------------------------------------------
  À SAVOIR
---------------------------------------------------------------------
  - La config Firebase n'est PAS un secret : elle est publique par
    conception. C'est le fichier de règles (étape 4) qui protège les
    données, pas la config.
  - Chaque salon = un nom libre. Deux personnes qui tapent le même nom
    de salon se retrouvent dans la même conversation.
  - Pas de chiffrement bout en bout : ne fais pas transiter de données
    sensibles. Pour du sérieux, il faudrait un vrai système de comptes.
=====================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ------------------------------------------------------------------
   PALETTE ET JETONS DE DESIGN
   Base bleu encre profond, bulles bleu barbeau pour soi,
   abricot pour les actions. Une seule police expressive (Fraunces)
   réservée au titre, Inter pour tout le reste.
------------------------------------------------------------------ */
:root{
  --fond:        #151A2B;
  --surface:     #1E2438;
  --surface-2:   #262E45;
  --bord:        #313A55;
  --texte:       #E8EAF2;
  --texte-doux:  #98A0BC;
  --moi:         #5B6BC0;  /* bulles de l'utilisateur courant */
  --accent:      #F0A868;  /* boutons, actions */
  --danger:      #E06B6B;
  --rayon:       14px;
}

*{ box-sizing: border-box; margin: 0; padding: 0; }

html, body{
  height: 100%;
  background: var(--fond);
  color: var(--texte);
  font-family: Inter, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* 100dvh = hauteur réelle sur mobile, barre d'adresse comprise */
body{ height: 100dvh; overflow: hidden; }

button{ font: inherit; cursor: pointer; border: none; }
input{ font: inherit; }

/* ==================================================================
   ÉCRAN 1 — ENTRÉE (choix du pseudo et du salon)
================================================================== */
#accueil{
  height: 100%;
  display: grid;
  place-items: center;
  padding: 24px;
}

.carte-accueil{
  width: 100%;
  max-width: 380px;
  text-align: center;
}

.marque{
  font-family: Fraunces, Georgia, serif;
  font-weight: 700;
  font-size: clamp(44px, 13vw, 64px);
  line-height: 1;
  letter-spacing: -0.02em;
  /* Le seul moment "spectaculaire" de l'interface : un halo doux */
  text-shadow: 0 0 42px rgba(91, 107, 192, .55);
}

.sous-titre{
  color: var(--texte-doux);
  font-size: 15px;
  margin: 14px 0 34px;
  line-height: 1.5;
}

.champ{
  display: block;
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--bord);
  border-radius: var(--rayon);
  color: var(--texte);
  padding: 14px 16px;
  margin-bottom: 12px;
  outline: none;
}
.champ::placeholder{ color: #6E7695; }
.champ:focus{ border-color: var(--moi); }

.bouton-principal{
  width: 100%;
  background: var(--accent);
  color: #241703;
  font-weight: 600;
  border-radius: var(--rayon);
  padding: 15px;
  margin-top: 6px;
  transition: filter .15s;
}
.bouton-principal:hover{ filter: brightness(1.08); }
.bouton-principal:disabled{ opacity: .5; cursor: not-allowed; }

.note{
  color: var(--texte-doux);
  font-size: 13px;
  margin-top: 18px;
  line-height: 1.5;
}

/* Bandeau rouge affiché si la config Firebase est absente ou invalide */
.alerte{
  background: rgba(224, 107, 107, .12);
  border: 1px solid rgba(224, 107, 107, .4);
  color: #FFC9C9;
  border-radius: var(--rayon);
  padding: 14px 16px;
  font-size: 13.5px;
  line-height: 1.55;
  text-align: left;
  margin-bottom: 22px;
}
.alerte code{ font-family: ui-monospace, monospace; color: #fff; }

/* ==================================================================
   ÉCRAN 2 — CHAT
================================================================== */
#chat{
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto; /* en-tête / messages / barre de saisie */
}
[hidden]{ display: none !important; }

.entete{
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--bord);
  padding-top: max(14px, env(safe-area-inset-top));
}

.bouton-retour{
  background: var(--surface-2);
  color: var(--texte-doux);
  border-radius: 10px;
  padding: 8px 11px;
  line-height: 1;
}
.bouton-retour:hover{ color: var(--texte); }

.titre-salon{ font-size: 16px; font-weight: 600; }

.etat{
  font-size: 12.5px;
  color: var(--texte-doux);
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 2px;
}
.point{
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--texte-doux);
}
.point.connecte{ background: #63C88B; }

/* --- Liste des messages --- */
.messages{
  overflow-y: auto;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.vide{
  margin: auto;
  text-align: center;
  color: var(--texte-doux);
  font-size: 14.5px;
  line-height: 1.6;
  max-width: 260px;
}

.ligne{
  display: flex;
  gap: 10px;
  align-items: flex-end;
  max-width: 78%;
  animation: arrivee .22s ease-out;
}
.ligne.a-moi{ align-self: flex-end; flex-direction: row-reverse; }

@keyframes arrivee{
  from{ opacity: 0; transform: translateY(8px); }
  to{ opacity: 1; transform: none; }
}
/* Respect des préférences système d'accessibilité */
@media (prefers-reduced-motion: reduce){
  .ligne{ animation: none; }
}

.pastille{
  width: 30px; height: 30px;
  flex-shrink: 0;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 600;
  color: #12162200;          /* rendu lisible via la couleur générée en JS */
  margin-bottom: 2px;
}
/* Masquée quand plusieurs messages du même auteur se suivent */
.pastille.fantome{ visibility: hidden; }

.bulle{
  background: var(--surface-2);
  border-radius: 16px 16px 16px 5px;
  padding: 9px 13px;
  line-height: 1.45;
  font-size: 15px;
  word-break: break-word;
  position: relative;
}
.a-moi .bulle{
  background: var(--moi);
  border-radius: 16px 16px 5px 16px;
}

.auteur{
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  margin-bottom: 3px;
}

.heure{
  font-size: 11px;
  color: var(--texte-doux);
  align-self: flex-end;
  margin-bottom: 4px;
  flex-shrink: 0;
}
.a-moi .heure{ color: var(--texte-doux); }

/* Croix de suppression, visible seulement sur ses propres messages */
.supprimer{
  background: none;
  color: rgba(255,255,255,.55);
  font-size: 15px;
  padding: 0 4px;
  align-self: center;
  opacity: 0;
  transition: opacity .15s;
}
.ligne:hover .supprimer, .supprimer:focus{ opacity: 1; }

/* --- Barre de saisie --- */
.composer{
  display: flex;
  gap: 10px;
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: var(--surface);
  border-top: 1px solid var(--bord);
}
.composer .champ{ margin: 0; border-radius: 22px; }

.envoyer{
  background: var(--accent);
  color: #241703;
  border-radius: 50%;
  width: 46px; height: 46px;
  flex-shrink: 0;
  font-size: 18px;
  display: grid;
  place-items: center;
}
.envoyer:disabled{ opacity: .4; cursor: not-allowed; }

/* Focus visible au clavier, sur tous les éléments interactifs */
:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>

<body>

<!-- ================= ÉCRAN 1 : ACCUEIL ================= -->
<section id="accueil">
  <div class="carte-accueil">
    <div id="alerte-config" class="alerte" hidden></div>

    <h1 class="marque">Le Salon</h1>
    <p class="sous-titre">Choisis un pseudo, entre le nom d'un salon,
       et parle avec tous ceux qui utilisent le même nom.</p>

    <input id="champ-pseudo" class="champ" placeholder="Ton pseudo" maxlength="20" autocomplete="off">
    <input id="champ-salon"  class="champ" placeholder="Nom du salon (ex. general)" maxlength="30" autocomplete="off">
    <button id="bouton-entrer" class="bouton-principal">Entrer dans le salon</button>

    <p class="note">Les messages sont publics pour tous ceux qui connaissent
       le nom du salon. Évite les informations sensibles.</p>
  </div>
</section>

<!-- ================= ÉCRAN 2 : CHAT ================= -->
<section id="chat" hidden>
  <header class="entete">
    <button id="bouton-retour" class="bouton-retour" aria-label="Changer de salon">←</button>
    <div>
      <div class="titre-salon" id="titre-salon"></div>
      <div class="etat"><span class="point" id="point-etat"></span><span id="texte-etat">Connexion…</span></div>
    </div>
  </header>

  <div class="messages" id="liste-messages"></div>

  <div class="composer">
    <input id="champ-message" class="champ" placeholder="Écris un message" maxlength="500" autocomplete="off">
    <button id="bouton-envoyer" class="envoyer" aria-label="Envoyer">↑</button>
  </div>
</section>


<script type="module">
/* ==================================================================
   1. CONFIGURATION FIREBASE
   ------------------------------------------------------------------
   COLLE TA CONFIG ICI : remplace tout l'objet ci-dessous par celui
   fourni par la console Firebase (étape 5 du guide en haut du fichier).
================================================================== */
const firebaseConfig = {
  apiKey:            "AIzaSyBY3h-zZzglWn_1Aofvx-sWO0ryvtQYa_g",
  authDomain:        "messagerie-94e1e.firebaseapp.com",
  projectId:         "messagerie-94e1e",
  storageBucket:     "messagerie-94e1e.firebasestorage.app",
  messagingSenderId: "153085504561",
  appId:             "1:153085504561:web:11b75ad3781cd1d1b7b910"
};

/* ==================================================================
   2. IMPORTS FIREBASE (version modulaire, chargée depuis le CDN Google)
   On n'importe que les fonctions utilisées : le navigateur ne
   télécharge donc pas tout le SDK.
================================================================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, doc,
         query, orderBy, limit, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ==================================================================
   3. RACCOURCIS VERS LES ÉLÉMENTS DE LA PAGE
================================================================== */
const $ = (id) => document.getElementById(id);

const ecranAccueil  = $("accueil");
const ecranChat     = $("chat");
const alerteConfig  = $("alerte-config");
const champPseudo   = $("champ-pseudo");
const champSalon    = $("champ-salon");
const boutonEntrer  = $("bouton-entrer");
const boutonRetour  = $("bouton-retour");
const titreSalon    = $("titre-salon");
const pointEtat     = $("point-etat");
const texteEtat     = $("texte-etat");
const listeMessages = $("liste-messages");
const champMessage  = $("champ-message");
const boutonEnvoyer = $("bouton-envoyer");

/* ==================================================================
   4. ÉTAT DE L'APPLICATION
   Tout est gardé en mémoire dans cet objet : plus simple à suivre
   que des variables éparpillées.
================================================================== */
const etat = {
  uid: null,          // identifiant Firebase de l'utilisateur (anonyme)
  pseudo: "",
  salon: "",
  arreterEcoute: null // fonction rendue par onSnapshot pour couper l'écoute
};

/* Petit stockage local tolérant aux erreurs : dans certains contextes
   (navigation privée stricte, aperçu en bac à sable) localStorage lève
   une exception. On l'enveloppe pour que l'app continue de marcher. */
const memoire = {
  lire(cle){ try { return localStorage.getItem(cle); } catch { return null; } },
  ecrire(cle, valeur){ try { localStorage.setItem(cle, valeur); } catch {} }
};

/* ==================================================================
   5. DÉMARRAGE
================================================================== */
let auth, db;

// Si la config n'a pas été remplacée, on prévient clairement au lieu
// de laisser une erreur silencieuse dans la console.
if (firebaseConfig.apiKey === "A_REMPLACER") {
  alerteConfig.hidden = false;
  alerteConfig.innerHTML =
    "Configuration Firebase manquante. Ouvre ce fichier dans un éditeur, " +
    "cherche <code>COLLE TA CONFIG ICI</code> et remplace l'objet " +
    "<code>firebaseConfig</code> par celui de ta console Firebase. " +
    "Le guide complet est en commentaire tout en haut du fichier.";
  boutonEntrer.disabled = true;
} else {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db   = getFirestore(app);

  // Connexion anonyme : Firebase attribue un uid stable et persistant
  // à ce navigateur, sans inscription ni mot de passe.
  signInAnonymously(auth).catch((err) => {
    alerteConfig.hidden = false;
    alerteConfig.textContent =
      "Connexion refusée par Firebase (" + err.code + "). " +
      "Vérifie que la méthode « Anonyme » est bien activée dans " +
      "Authentication → Sign-in method.";
    boutonEntrer.disabled = true;
  });

  onAuthStateChanged(auth, (utilisateur) => {
    if (utilisateur) etat.uid = utilisateur.uid;
  });
}

// On repropose le dernier pseudo et le dernier salon utilisés.
champPseudo.value = memoire.lire("pseudo") || "";
champSalon.value  = memoire.lire("salon")  || "general";

/* ==================================================================
   6. ENTRER DANS UN SALON
================================================================== */
boutonEntrer.addEventListener("click", entrer);
champPseudo.addEventListener("keydown", (e) => { if (e.key === "Enter") champSalon.focus(); });
champSalon .addEventListener("keydown", (e) => { if (e.key === "Enter") entrer(); });

function entrer(){
  const pseudo = champPseudo.value.trim();
  // Nom de salon normalisé : minuscules, sans accents ni espaces,
  // pour que « Général » et « general » mènent au même endroit.
  const salon = champSalon.value.trim().toLowerCase()
                  .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                  .replace(/[^a-z0-9-]/g, "-").replace(/-+/g, "-") || "general";

  if (!pseudo) { champPseudo.focus(); return; }

  etat.pseudo = pseudo;
  etat.salon  = salon;
  memoire.ecrire("pseudo", pseudo);
  memoire.ecrire("salon", salon);

  titreSalon.textContent = "#" + salon;
  ecranAccueil.hidden = true;
  ecranChat.hidden = false;
  champMessage.focus();

  ecouterMessages();
}

// Retour à l'accueil : on coupe l'écoute pour ne pas consommer
// de lectures Firestore inutiles en arrière-plan.
boutonRetour.addEventListener("click", () => {
  if (etat.arreterEcoute) etat.arreterEcoute();
  etat.arreterEcoute = null;
  listeMessages.innerHTML = "";
  ecranChat.hidden = true;
  ecranAccueil.hidden = false;
});

/* ==================================================================
   7. ÉCOUTE TEMPS RÉEL
   onSnapshot rappelle la fonction à chaque changement dans la
   collection : c'est ce qui rend l'app instantanée, sans WebSocket
   ni rafraîchissement manuel.
================================================================== */
function ecouterMessages(){
  const requete = query(
    collection(db, "salons", etat.salon, "messages"),
    orderBy("createdAt", "asc"),
    limit(200)                      // on ne charge que les 200 derniers
  );

  etat.arreterEcoute = onSnapshot(requete,
    (instantane) => {
      majEtat(true);
      // On vérifie si l'utilisateur était déjà en bas de la liste :
      // si oui on suit les nouveaux messages, sinon on le laisse lire.
      const enBas = listeMessages.scrollHeight - listeMessages.scrollTop
                    - listeMessages.clientHeight < 120;

      afficherMessages(instantane.docs);

      if (enBas) listeMessages.scrollTop = listeMessages.scrollHeight;
    },
    (err) => {
      majEtat(false);
      listeMessages.innerHTML =
        '<p class="vide">Lecture refusée par Firestore (' + err.code + ').<br>' +
        'Vérifie les règles de sécurité dans la console.</p>';
    }
  );
}

function majEtat(connecte){
  pointEtat.classList.toggle("connecte", connecte);
  texteEtat.textContent = connecte ? "En direct" : "Hors ligne";
}

/* ==================================================================
   8. AFFICHAGE DES MESSAGES
================================================================== */
function afficherMessages(documents){
  listeMessages.innerHTML = "";

  if (documents.length === 0){
    listeMessages.innerHTML =
      '<p class="vide">Personne n\'a encore parlé ici.<br>' +
      'Envoie le premier m
